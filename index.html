<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dub your video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef1f4;
    --ink: #101c2b;
    --muted: #5a6878;
    --line: #c9d1da;
    --signal: #1f4fff;
    --signal-dark: #1538c2;
    --ok: #0f7a4d;
    --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e1620;
      --ink: #e8edf3;
      --muted: #94a3b4;
      --line: #263445;
      --signal: #5b82ff;
      --signal-dark: #89a4ff;
      --ok: #4cc38a;
      --bad: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 28px 18px 60px;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 {
    font-size: clamp(2.2rem, 9vw, 3.4rem);
    line-height: 1;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin: 18px 0 10px;
  }
  .sub { color: var(--muted); font-size: 1.05rem; line-height: 1.5; margin: 0 0 28px; max-width: 42ch; }

  /* the one memorable element: a waveform that turns from one "voice" to another */
  .wave { display: flex; align-items: center; gap: 3px; height: 44px; margin-bottom: 6px; }
  .wave i { flex: 1; max-width: 6px; border-radius: 3px; background: var(--ink); opacity: .85; }
  .wave i.t { background: var(--signal); opacity: 1; }
  .wave.busy i { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scaleY(.45); } }
  @media (prefers-reduced-motion: reduce) { .wave.busy i { animation: none; } }

  .drop {
    display: block;
    border: 2px dashed var(--line);
    border-radius: 14px;
    padding: 26px 18px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop:focus-within, .drop.drag { border-color: var(--signal); background: color-mix(in srgb, var(--signal) 6%, transparent); }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .drop strong { display: block; font-size: 1.1rem; }
  .drop span { color: var(--muted); font-size: .92rem; }

  label.field { display: block; margin-top: 22px; font-weight: 600; }
  select {
    width: 100%; margin-top: 8px; padding: 14px 12px;
    font: inherit; color: var(--ink); background: transparent;
    border: 1.5px solid var(--line); border-radius: 10px;
  }
  select:focus-visible, button:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  select option { color: #101c2b; }

  button.go {
    width: 100%; margin-top: 24px; padding: 16px;
    font: inherit; font-weight: 800; font-size: 1.1rem;
    color: #fff; background: var(--signal);
    border: 0; border-radius: 12px; cursor: pointer;
  }
  button.go:hover:not(:disabled) { background: var(--signal-dark); }
  button.go:disabled { opacity: .5; cursor: not-allowed; }

  #status { margin-top: 20px; min-height: 1.4em; font-size: .98rem; }
  #status.err { color: var(--bad); }
  #status.done { color: var(--ok); font-weight: 600; }

  #result { margin-top: 18px; display: none; }
  #result video { width: 100%; border-radius: 12px; background: #000; }
  #result a.dl {
    display: block; text-align: center; margin-top: 12px; padding: 14px;
    font-weight: 800; text-decoration: none;
    color: var(--signal); border: 2px solid var(--signal); border-radius: 12px;
  }
  #result a.dl:hover { background: color-mix(in srgb, var(--signal) 10%, transparent); }
</style>
</head>
<body>
<main>
  <div class="wave" id="wave" aria-hidden="true"></div>
  <h1>Dub your video</h1>
  <p class="sub">Upload a video, pick a language, and get it back with a new voice.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="video/*">
    <strong id="fileName">Choose a video</strong>
    <span id="fileHint">MP4 or MOV, up to 100 MB</span>
  </label>

  <label class="field" for="lang">Dub into
    <select id="lang">
      <option value="zh">Chinese</option>
      <option value="hi">Hindi</option>
      <option value="ar">Arabic</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="pt">Portuguese</option>
      <option value="ru">Russian</option>
      <option value="tr">Turkish</option>
      <option value="it">Italian</option>
      <option value="id">Indonesian</option>
      <option value="en">English</option>
    </select>
  </label>

  <button class="go" id="dub" disabled>Dub video</button>
  <div id="status" role="status" aria-live="polite"></div>

  <div id="result">
    <video id="player" controls playsinline></video>
    <a class="dl" id="download" download="dubbed-video.mp4">Download dubbed video</a>
  </div>
</main>

<script>
  // >>> Put your Worker address here after you deploy it <<<
  const WORKER_URL = "https://dubbing-api.sufyan-ai-dubbing.workers.dev";

  const MAX_MB = 100;
  const $ = (id) => document.getElementById(id);
  const fileInput = $("file"), dubBtn = $("dub"), statusEl = $("status"), wave = $("wave");

  // build the waveform bars
  for (let i = 0; i < 48; i++) {
    const b = document.createElement("i");
    const h = 14 + Math.abs(Math.sin(i * 0.55) * 26) + (i % 5) * 2;
    b.style.height = h + "px";
    if (i >= 24) b.className = "t";
    b.style.animationDelay = (i * 0.04) + "s";
    wave.appendChild(b);
  }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || "";
  }

  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if (!f) return;
    if (f.size > MAX_MB * 1024 * 1024) {
      setStatus(`This video is ${(f.size / 1048576).toFixed(0)} MB. Choose one under ${MAX_MB} MB.`, "err");
      fileInput.value = "";
      dubBtn.disabled = true;
      return;
    }
    $("fileName").textContent = f.name;
    $("fileHint").textContent = (f.size / 1048576).toFixed(1) + " MB";
    setStatus("");
    dubBtn.disabled = false;
  });

  const drop = $("drop");
  ["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("drag"); }));
  ["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("drag"); }));
  drop.addEventListener("drop", ev => {
    if (ev.dataTransfer.files.length) {
      fileInput.files = ev.dataTransfer.files;
      fileInput.dispatchEvent(new Event("change"));
    }
  });

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  dubBtn.addEventListener("click", async () => {
    const file = fileInput.files[0];
    const lang = $("lang").value;
    if (!file) return;

    dubBtn.disabled = true;
    $("result").style.display = "none";
    wave.classList.add("busy");

    try {
      // 1) upload + start
      setStatus("Uploading your video...");
      const form = new FormData();
      form.append("file", file);
      form.append("target_lang", lang);

      const start = await fetch(WORKER_URL + "/dub", { method: "POST", body: form });
      const startData = await start.json();
      if (!start.ok || !startData.dubbing_id) {
        throw new Error(readError(startData) || "Could not start dubbing.");
      }
      const id = startData.dubbing_id;

      // 2) wait until finished
      setStatus("Dubbing in progress. This can take a few minutes.");
      let tries = 0;
      while (true) {
        await sleep(5000);
        const s = await fetch(`${WORKER_URL}/status/${id}`);
        const sd = await s.json();
        if (sd.status === "dubbed") break;
        if (sd.status === "failed") throw new Error(sd.error || "Dubbing failed. Try another video.");
        if (++tries > 240) throw new Error("This is taking too long. Try a shorter video.");
      }

      // 3) fetch result
      setStatus("Preparing your video...");
      const dl = await fetch(`${WORKER_URL}/download/${id}/${lang}`);
      if (!dl.ok) throw new Error("Could not download the dubbed video.");
      const blob = await dl.blob();
      const href = URL.createObjectURL(blob);

      $("player").src = href;
      $("download").href = href;
      $("result").style.display = "block";
      setStatus("Your video is ready.", "done");
    } catch (e) {
      setStatus(e.message || "Something went wrong.", "err");
    } finally {
      wave.classList.remove("busy");
      dubBtn.disabled = false;
    }
  });

  function readError(d) {
    if (!d) return "";
    if (typeof d.error === "string") return d.error;
    if (d.detail && typeof d.detail === "string") return d.detail;
    if (d.detail && d.detail.message) return d.detail.message;
    return "";
  }
</script>
</body>
</html>
